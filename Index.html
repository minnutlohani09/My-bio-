<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md. Minnut Lohani | Bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #050a14;
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px 20px;
            border-radius: 40px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-area {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
            position: relative;
        }

        .profile-area img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2ff;
            position: relative;
            z-index: 2;
            animation: pulse-img 3s infinite ease-in-out;
        }

        @keyframes pulse-img {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); }
        }

        h1 { font-size: 20px; font-weight: 600; margin-bottom: 5px; color: #fff; }
        .role { color: #00d2ff; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .links { display: flex; flex-direction: column; gap: 15px; }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: #fff;
            color: #050a14;
            transform: translateY(-5px);
        }

        .btn i { font-size: 22px; width: 30px; }
        .footer { margin-top: 35px; font-size: 11px; opacity: 0.4; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-area">
        <img src="profile.jpg" alt="Minnut Lohani">
    </div>

    <h1>Md. Minnut Fathen Morsaline Lohani</h1>
    <div class="role">Digital Creator</div>

    <div class="links">
        <a href="https://www.facebook.com/share/16xWy4d5qk/" target="_blank" class="btn">
            <i class="fab fa-facebook"></i> Facebook Profile
        </a>

        <a href="#" target="_blank" class="btn">
            <i class="fab fa-youtube"></i> YouTube Channel
        </a>

        <a href="https://wa.me/8801XXXXXXXXX" target="_blank" class="btn">
            <i class="fab fa-whatsapp"></i> WhatsApp Me
        </a>
    </div>

    <div class="footer">POWERED BY MINNUT LOHANI</div>
</div>

</body>
</html>
